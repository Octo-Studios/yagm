plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath.set(project(":common").loom.accessWidenerPath)
}

configurations {
    common
    shadowCommon
    compileOnly.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url "https://maven.tamaized.com/releases"
        content {
            includeGroup "team-twilight"
        }
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${architectury_version}"
    common(project(path: ":common", configuration: "namedElements")) { transitive = false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
    compileOnly ("top.theillusivec4.curios:curios-neoforge:${rootProject.curios_api_version}:api")
    compileOnly ("top.theillusivec4.curios:curios-neoforge:${rootProject.curios_api_version}")
    compileOnly ("io.wispforest:accessories-neoforge:${rootProject.accessories_version}")
    compileOnly("team-twilight:twilightforest:${rootProject.twilight_forest_version}:universal") { transitive = false }
    compileOnly "curse.maven:revive-me-676140:${rootProject.revive_me_file_id}"
    compileOnly "curse.maven:backpacked-352835:${rootProject.backpacked_neoforge_file_id}"
    compileOnly "curse.maven:travelers-backpack-321117:${rootProject.travelers_backpack_neoforge_file_id}"
    compileOnly "curse.maven:sophisticated-core-618298:${rootProject.sophisticated_core_file_id}"
    compileOnly "curse.maven:sophisticated-backpacks-422301:${rootProject.sophisticated_backpacks_file_id}"
    compileOnly "curse.maven:cosmetic-armor-reworked-237307:${rootProject.cosmetic_armor_reworked_file_id}"
}

def resourceTargets = ['META-INF/mods.toml', 'pack.mcmeta']
def replaceProperties = [
        mod_id     : mod_id, mod_name: mod_name,
        mod_version: mod_version, mod_authors: mod_authors
]

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    exclude "architectury.common.json"

    archiveClassifier = "dev-" + loom.platform.get().name()
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar

    archiveClassifier = loom.platform.get().name()
}

jar {
    archiveClassifier = "dev"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
